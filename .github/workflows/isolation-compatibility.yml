name: Kernel containment and regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    name: Policy / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install existing dependencies
        run: |
          /usr/bin/python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Unprivileged policy and schema tests
        env:
          PYTHONPATH: tests
        run: .venv/bin/python -m unittest test_preflight test_report_schema test_egress.BrokerInputTests test_credentials test_operator_service test_v18_reporting test_v19_investigation.PlannerTests -v
  kernel:
    name: Kernel / ${{ matrix.os }} / system Python
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install existing dependencies
        run: |
          /usr/bin/python3 --version
          /usr/bin/python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Require actual kernel isolation
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-24.04" ]; then
            sudo apparmor_parser -r deployment/apparmor/aegis-supervisor
            prefix=(sudo aa-exec -p aegis-supervisor -- runuser -u "$(id -un)" --)
          else
            prefix=()
          fi
          if ! "${prefix[@]}" .venv/bin/python aegis_sandbox_check.py; then
            echo "::error::NOT EXECUTED: kernel acceptance requires working namespaces and seccomp; no fallback permitted."
            exit 1
          fi
      - name: Full regression and adversarial kernel acceptance
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-24.04" ]; then
            prefix=(sudo aa-exec -p aegis-supervisor -- runuser -u "$(id -un)" --)
          else
            prefix=()
          fi
          "${prefix[@]}" .venv/bin/python - <<'PY'
          import sys, unittest
          suite = unittest.defaultTestLoader.discover("tests")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped:
              print("NOT EXECUTED:", result.skipped)
          sys.exit(0 if result.wasSuccessful() and not result.skipped else 1)
          PY
      - name: Signed source-review and HTTP demos
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-24.04" ]; then
            prefix=(sudo aa-exec -p aegis-supervisor -- runuser -u "$(id -un)" --)
          else
            prefix=()
          fi
          "${prefix[@]}" .venv/bin/python aegis_demo.py
          "${prefix[@]}" .venv/bin/python aegis_http_demo.py

  source_snapshot:
    name: Export tracked feature branch for independent testing
    if: github.event_name == 'push' && (github.ref == 'refs/heads/feat/v1.5-credential-approvals' || github.ref == 'refs/heads/feat/v1.7-bounded-reproduction' || github.ref == 'refs/heads/feat/v1.8-findings-reporting' || github.ref == 'refs/heads/feat/v1.9-investigation-orchestrator')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Archive only tracked files at this commit
        run: git archive --format=zip HEAD -o /tmp/aegis-assessment-source.zip
      - name: Provide temporary source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: aegis-assessment-source
          path: /tmp/aegis-assessment-source.zip
          retention-days: 1
          if-no-files-found: error

  notification_cross_uid:
    name: v1.8 separate-UID receiver / ubuntu-24.04
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain dependencies
        run: |
          /usr/bin/python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify distinct sender and receiver OS identities
        run: sudo -n .venv/bin/python tests/cross_uid_receiver_acceptance.py --sender-uid "$(id -u)" --sender-gid "$(id -g)"
